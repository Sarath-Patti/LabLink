version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lablink_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lablink_dev}
      POSTGRES_USER: ${POSTGRES_USER:-lablink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lablink_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lablink_user} -d ${POSTGRES_DB:-lablink_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
